# Lefthook 2.x configuration — https://lefthook.dev/configuration/
# Hooks stay fast by relying on Nx affected instead of running the whole workspace.

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint-affected
      run: pnpm nx affected -t lint --base=HEAD

pre-push:
  jobs:
    - name: verify-affected
      # `nx affected` with no base defaults to `--base=main`, and on a push from
      # main that is HEAD compared against itself: the affected set is empty and
      # this job reported success without running a single task. It had never
      # checked anything pushed from main.
      #
      # `@{push}` is what the remote holds for the branch being pushed, which is
      # exactly the question — everything since it is what the push adds. It
      # does not resolve on a branch with no upstream yet, so origin/main
      # answers for a new branch, and a workspace with neither verifies all of
      # itself rather than none of it.
      run: |
        base=$(git rev-parse --verify --quiet @{push} || git rev-parse --verify --quiet origin/main || true)
        if [ -n "$base" ]; then
          pnpm nx affected -t typecheck test build --base=$base
        else
          pnpm nx run-many -t typecheck test build
        fi

    - name: gitleaks
      # Optional locally: CI always runs the full secret scan.
      #
      # Single quotes on purpose. On Windows lefthook hands the script to
      # `sh.exe -c "<script>"`, so a double quote inside it closes that string
      # early and the shell never sees `else`/`fi`. Keep the if/else too: an
      # `&& ... || echo` one-liner would swallow the exit code that reports a
      # secret and let the push through.
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-push --staged
        else
          echo 'gitleaks not installed locally - CI will run the secret scan'
        fi
