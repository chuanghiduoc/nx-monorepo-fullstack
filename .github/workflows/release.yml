# Builds, scans, describes and signs the images.
#
# The point of every step here is that somebody can check it afterwards. An
# image with a signature nobody verifies is a decoration, so
# `docs/ops/production.md` carries the verification commands beside the
# publishing ones — and each of them was run against the artifacts this workflow
# produces before the workflow was called done.
name: Release

on:
  push:
    tags:
      - 'v*'
  # So the pipeline can be exercised without cutting a release. It builds and
  # scans; it does not push, because a tag is what makes a release a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Pushing to the registry, and writing the attestation and the signature
      # to it. `id-token: write` is what makes keyless signing possible: the
      # workflow proves who it is with an OIDC token rather than with a key
      # somebody has to keep safe for a year.
      packages: write
      id-token: write
      attestations: write

    strategy:
      # One image failing to build should not hide whether the others do.
      fail-fast: false
      matrix:
        include:
          - name: core-api
            dockerfile: apps/core/api/Dockerfile
          - name: core-worker
            dockerfile: apps/core/worker/Dockerfile
          - name: core-web
            dockerfile: apps/core/web/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Built once and loaded locally first, so the scan looks at the same
      # bytes that are pushed. Scanning after a push would publish an image
      # nobody had looked at yet, and scanning a rebuild would scan a different
      # one.
      - name: Build
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The web image inlines its API origin at build time; the other two
          # ignore it.
          build-args: |
            NEXT_PUBLIC_API_ORIGIN=${{ vars.PUBLIC_ORIGIN || 'http://localhost:8080' }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fails the build on anything fixable. `ignore-unfixed` because a
      # vulnerability with no fix available is not something this pipeline can
      # act on — failing on it would train people to pass `--skip`, which is how
      # a scanner stops being read.
      - name: Scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Bill of materials
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ matrix.name }}:ci
          format: 'cyclonedx'
          output: 'sbom-${{ matrix.name }}.cdx.json'

      - name: Keep the bill of materials with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

      # Only a tag publishes. `workflow_dispatch` exists so the pipeline can be
      # exercised — built and scanned — without cutting a release.
      - name: Push
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            NEXT_PUBLIC_API_ORIGIN=${{ vars.PUBLIC_ORIGIN || 'http://localhost:8080' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

      # Where the image came from: the commit, the workflow, the runner. SLSA
      # build provenance, attached to the image rather than kept beside it, so
      # it travels with what it describes.
      - name: Provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attach the bill of materials to the image
        if: steps.push.outcome == 'success'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.cdx.json
          push-to-registry: true

      - name: Install cosign
        if: steps.push.outcome == 'success'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's identity, recorded in
      # a public transparency log, and verified with no key anybody had to keep
      # safe. A key would be one more secret to rotate and lose.
      - name: Sign
        if: steps.push.outcome == 'success'
        run: |
          cosign sign --yes \
            "${REGISTRY}/${REPOSITORY}/${NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}

      # Verified here, in the pipeline that produced it. A signature nobody
      # checks is a decoration, and the first check should not be the first time
      # somebody needs it to work.
      - name: Verify the signature we just made
        if: steps.push.outcome == 'success'
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REGISTRY}/${REPOSITORY}/${NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY: ${{ github.repository }}
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
