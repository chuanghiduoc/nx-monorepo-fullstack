name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A new push supersedes the previous run for the same ref. Runs on main are not
# cancelled: main's history is what release and deploy decisions read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        # Version comes from the "packageManager" field so CI and local stay in sync.
        with:
          run_install: false

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Connect your workspace by running "nx connect" and uncomment this line to enable task distribution
      # - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - uses: nrwl/nx-set-shas@v5

      # The atomized `test-ci` / `e2e-ci` targets split suites per file, but Nx
      # refuses to run them without Nx Cloud. Switch to them in the same commit
      # that enables `nx connect` (see docs/upgrades.md).
      - run: pnpm exec nx affected -t lint typecheck test build e2e

      # Dead code and unused dependencies are cheap to catch here and expensive later.
      - run: pnpm knip

      # Cheapest possible dependency check, kept alongside OSV-Scanner on purpose:
      # it needs no setup and fails fast on known advisories. It gates the build —
      # a scanner that cannot fail is decoration.
      - run: pnpm audit --audit-level=high

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()

  # PR-stage security gate (spec §3). Image scanning, SBOM, SLSA provenance and
  # signing run in the release workflow instead, once images exist.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    # semgrep/semgrep-action was archived in 2024; the maintained path is the
    # official container image running `semgrep ci`.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep ci --config auto --error

  # Reusable workflow published by the OSV-Scanner project. The standalone
  # action path used previously does not exist as a versioned reference.
  dependency-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
