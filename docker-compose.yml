name: nx-monorepo-fullstack

# Development infrastructure only — the apps themselves run from the Nx dev servers.
# The production-shaped run is docker-compose.prod.yml, which builds images.
services:
  postgres:
    # PostgreSQL 18.6 with pgvector, not `postgres:18-alpine`: measured, the
    # Alpine image has no `vector` extension at all, and the AI schema creates
    # one. Same server version, Debian base, larger image.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # postgres:18+ expects a single mount at /var/lib/postgresql and places the
      # cluster in a versioned subdirectory, so pg_upgrade --link can work later.
      - pgdata:/var/lib/postgresql
      # Grants the dev login to the NOLOGIN roles the migration creates. The
      # roles carry no password in git; this file is the development-only
      # equivalent of the step an operator runs once in production.
      - ./tools/postgres/10-dev-logins.sh:/docker-entrypoint-initdb.d/10-dev-logins.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
      # Without a start period every probe during initialisation counts against
      # `retries`, and a first start — initdb, the init script, then a restart —
      # takes longer than ten of them on a cold machine. The container is then
      # marked unhealthy and everything that waits on it aborts, on a database
      # that goes on to become healthy seconds later.
      start_period: 60s

  # Queue, quota, rate limiting, locks and idempotency acceleration.
  # BullMQ requires noeviction: evicting a key here would silently drop jobs.
  redis-critical:
    image: redis:8-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable cache and transient realtime state — safe to evict under pressure.
  redis-cache:
    image: redis:8-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Grafana + Loki + Tempo + Prometheus in one container, opt-in to keep the
  # default dev footprint small: docker compose --profile observability up -d
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.14
    profiles: ['observability']
    ports:
      - '127.0.0.1:3001:3000'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'

volumes:
  pgdata:
  redisdata:
  miniodata:
