packages:
  - 'apps/*/*'
  - 'libs/*/*'
  - 'libs/*/*/*'
  - 'libs/*/*/*/*'
  - 'tools/*'
  - 'libs/core/server/platform/*'
  - 'libs/core/server/feature/*'
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
  '@nestjs/core': false
  less: true
  sharp: true
  esbuild: false
  lefthook: true
  '@swc/core': true
  nx: true
  '@prisma/engines': true
  prisma: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  '@scarf/scarf': false
  msgpackr-extract: false
catalog:
  '@nestjs/common': '^11.2.3'
  '@nestjs/core': '^11.2.3'
  '@nestjs/platform-fastify': '^11.2.3'
  # Pinned to the Nest already installed rather than to the newest release.
  # `@nestjs/websockets` 12 peers on `@nestjs/common` ^12, and a second copy of
  # `@nestjs/common` is what splits a framework that uses classes as DI tokens
  # — measured once already, over `supports-color`, and once was enough.
  '@nestjs/websockets': '^11.2.3'
  '@nestjs/platform-socket.io': '^11.2.3'
  'socket.io': '^4.8.3'
  'socket.io-client': '^4.8.3'
  ai: '^7.0.93'
  '@ai-sdk/anthropic': '^4.0.49'
  '@ai-sdk/openai': '^4.0.59'
  '@opentelemetry/sdk-trace-node': '^2.11.0'
  '@opentelemetry/resources': '^2.11.0'
  '@opentelemetry/semantic-conventions': '^1.43.0'
  '@opentelemetry/core': '^2.11.0'
  '@opentelemetry/exporter-trace-otlp-http': '^0.222.0'
  'prom-client': '^15.1.3'
  '@socket.io/redis-adapter': '^8.3.0'
  '@nestjs/testing': '^11.0.0'
  '@tailwindcss/postcss': '^4.3.3'
  # Held at a minor rather than a major, and moved when a scan says to. Trivy
  # found twenty-four fixable HIGH and CRITICAL findings in 16.1.7 whose fix was
  # 16.2.11 or later — which is the release gate doing the job it exists for.
  next: '~16.3.4'
  postcss: '^8.5.26'
  react: '^19.0.0'
  react-dom: '^19.0.0'
  reflect-metadata: '^0.2.0'
  rxjs: '^7.8.1'
  tailwindcss: '^4.3.3'
  tslib: '^2.3.0'
  class-variance-authority: '^0.7.1'
  clsx: '^2.1.1'
  radix-ui: '^1.6.7'
  shadcn: '^4.19.1'
  tailwind-merge: '^3.6.0'
  tw-animate-css: '^1.4.0'
  vitest: '~4.1.0'
  '@testing-library/react': '16.3.0'
  jsdom: '^27.1.0'
  better-auth: '^1.7.2'
  '@opentelemetry/api': '^1.9.1'
  '@prisma/adapter-pg': '^7.10.0'
  '@prisma/client': '^7.10.0'
  pg: '^8.23.0'
  prisma: '^7.10.0'
  dotenv: '^17.4.2'
  '@testcontainers/postgresql': '^12.1.0'
  '@nestjs/config': '^12.0.0'
  nestjs-pino: '^5.0.0'
  pino-pretty: '^13.1.3'
  zod: '^4.5.4'
  fastify: '^5.12.1'
  class-transformer: '^0.5.1'
  '@fastify/cors': '^11.3.0'
  '@fastify/helmet': '^13.1.1'
  '@fastify/multipart': '^10.1.1'
  '@nestjs/swagger': '^11.4.7'
  nestjs-zod: '^5.5.0'
  tsx: '^4.23.13'
  '@nestjs/throttler': '^6.5.0'
  '@nest-lab/throttler-storage-redis': '^1.2.0'
  ioredis: '^6.0.0'
  '@tanstack/react-query': '^5.102.8'
  fishery: '^2.4.0'
  '@faker-js/faker': '^10.6.0'
  '@scalar/fastify-api-reference': '^1.67.0'
  '@types/pg': '^8.23.1'
  '@better-auth/utils': '^0.5.0'
  '@better-auth/api-key': '^1.7.2'
  'pino': '^10.3.1'
  '@hookform/resolvers': '^5.9.1'
  'react-hook-form': '^7.87.0'
  'next-intl': '^4.14.1'
  '@nx/devkit': '23.1.1'
  '@nx/playwright': '23.1.1'
  '@playwright/test': '^1.37.0'
  '@vitejs/plugin-react': '^6.0.0'
  testcontainers: '^12.1.0'
  'lucide-react': '^1.36.0'
  'next-themes': '^0.4.6'
  'sonner': '^2.0.8'
  'input-otp': '^1.5.0'
  'bullmq': '^6.3.4'
  '@openfeature/server-sdk': '^1.23.0'
  '@aws-sdk/client-s3': '^3.1125.0'
  '@aws-sdk/s3-presigned-post': '^3.1125.0'
  '@aws-sdk/s3-request-presigner': '^3.1125.0'
  'file-type': '^22.0.2'
# The two `image-size` advisories are the only findings with no version to move
# to: both read `<= 2.0.2` with no patched release, so raising the version does
# not answer them. They are reachable only through less's `image-size()`
# function, which reads an image file named by a `.less` stylesheet — and this
# workspace has no `.less` file for anyone to name one in. less itself arrives
# under `@nx/webpack`, a devDependency that no shipped image contains.
#
# Recorded rather than waived: drop these two entries the moment a patched
# `image-size` exists, and re-read this the next time the toolchain moves.
auditConfig:
  ignoreGhsas:
    # image-size: JXL and HEIF parsers allow denial of service through infinite loops
    - GHSA-5p2g-fcmc-qvqq
    # image-size: ICNS parser allows denial of service through an infinite loop
    - GHSA-w3rx-r6r6-pgpr
# A transitive dependency resolved from a git URL or a tarball is one nobody
# reviewed and no registry can revoke.
blockExoticSubdeps: true
# `minimumReleaseAge` and `trustPolicy` are the two settings this file still
# does not set, and the exclusion list below reads as though the first of them
# were already in force. Neither can be turned on against this lockfile:
# `minimumReleaseAge: 10080` rejects forty-five entries as too new, and
# `trustPolicy: no-downgrade` rejects six more — prisma and semver among
# them — as possible takeovers. Both need the lockfile resolved again from
# scratch, which is a decision about every dependency in the workspace rather
# than a setting to add.
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.75'
  - '@ai-sdk/openai@4.0.59'
  - ai@7.0.93
overrides:
  fastify: '^5.12.1'
  # One copy of `supports-color`, and it is not about colours.
  #
  # `file-type` — which the storage driver uses to read magic bytes — is an
  # *optional peer* of `@nestjs/common`. Two copies of `file-type` therefore
  # mean two copies of `@nestjs/common`, and two of those mean two copies of
  # `@nestjs/core`. Nest keys dependency injection on the class object, so the
  # `ApplicationConfig` one module asks for stops being the one another
  # provides, and the API fails to boot with "Nest can't resolve dependencies
  # of the LoggerModule (pino-params, ?)".
  #
  # Measured: adding `file-type` produced `file-type@21.3.4_supports-color@7.2.0`
  # beside `file-type@21.3.4_supports-color@8.1.1`, and that one transitive
  # difference nine levels down is what split the framework in two.
  supports-color: '^8.1.1'
  # Advisories against transitive dependencies. Nothing below is a package this
  # workspace chose: each arrives through the build toolchain or through
  # Prisma, so an override is the only lever there is. The range in each key
  # narrows the override to the branch the advisory names — several of these
  # packages are installed at more than one major, and rewriting a major that
  # was never vulnerable is how an override breaks a build it was meant to fix.
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
  'deepmerge-ts@<8.0.0': '^8.0.0'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'mysql2@<3.23.1': '^3.23.1'
  'qs@<6.16.0': '^6.16.0'
  'smol-toml@<1.7.1': '^1.7.1'
  # sockjs reaches this as `require('uuid').v4`, and 11 still ships a CommonJS
  # build, so the major is only a major on paper here.
  'uuid@<11.1.1': '^11.1.1'
