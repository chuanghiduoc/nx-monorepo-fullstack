packages:
  - 'apps/*/*'
  - 'libs/*/*'
  - 'libs/*/*/*'
  - 'tools/*'
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
  '@nestjs/core': false
  less: true
  sharp: true
  esbuild: false
  lefthook: true
  '@swc/core': true
  nx: true
  '@prisma/engines': true
  prisma: true
  cpu-features: true
  protobufjs: true
  ssh2: true
  '@scarf/scarf': false
catalog:
  '@nestjs/common': '^11.2.3'
  '@nestjs/core': '^11.2.3'
  '@nestjs/platform-fastify': '^11.2.3'
  '@nestjs/testing': '^11.0.0'
  '@tailwindcss/postcss': '^4.3.3'
  'next': '~16.1.6'
  'postcss': '^8.5.26'
  'react': '^19.0.0'
  'react-dom': '^19.0.0'
  'reflect-metadata': '^0.2.0'
  'rxjs': '^7.8.1'
  'tailwindcss': '^4.3.3'
  'tslib': '^2.3.0'
  'class-variance-authority': '^0.7.1'
  'clsx': '^2.1.1'
  'radix-ui': '^1.6.7'
  'shadcn': '^4.19.1'
  'tailwind-merge': '^3.6.0'
  'tw-animate-css': '^1.4.0'
  'vitest': '~4.1.0'
  '@testing-library/react': '16.3.0'
  'jsdom': '^27.1.0'
  'better-auth': '^1.7.2'
  '@opentelemetry/api': '^1.9.1'
  '@prisma/adapter-pg': '^7.10.0'
  '@prisma/client': '^7.10.0'
  'pg': '^8.23.0'
  'prisma': '^7.10.0'
  'dotenv': '^17.4.2'
  '@testcontainers/postgresql': '^12.1.0'
  '@nestjs/config': '^12.0.0'
  'nestjs-pino': '^5.0.0'
  'pino-pretty': '^13.1.3'
  'zod': '^4.5.4'
  'fastify': '^5.12.1'
  'class-transformer': '^0.5.1'
  '@fastify/cors': '^11.3.0'
  '@fastify/helmet': '^13.1.1'
  '@nestjs/swagger': '^11.4.7'
  'nestjs-zod': '^5.5.0'
  'tsx': '^4.23.13'
  '@nestjs/throttler': '^6.5.0'
  '@nest-lab/throttler-storage-redis': '^1.2.0'
  'ioredis': '^6.0.0'

# @nestjs/platform-fastify pins fastify 5.11.x while @fastify/helmet requires
# 5.12.x. Two copies means two sets of FastifyInstance types, and a plugin
# registered against one does not typecheck against the other. The versions are
# minor-compatible, so the workspace resolves a single one.
overrides:
  fastify: '^5.12.1'
